<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fundo Squircle Flat (Verde esmeralda para telemetria/saúde do hardware) -->
  <rect x="12" y="12" width="104" height="104" rx="24" ry="24" fill="#27ae60"/>

  <!-- Pinos de conexão do processador -->
  <!-- Topo -->
  <line x1="50" y1="28" x2="50" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="28" x2="64" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="28" x2="78" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="50" y1="90" x2="50" y2="100" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="90" x2="64" y2="100" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="90" x2="78" y2="100" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Esquerda -->
  <line x1="28" y1="50" x2="38" y2="50" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="64" x2="38" y2="64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="78" x2="38" y2="78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Direita -->
  <line x1="90" y1="50" x2="100" y2="50" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="64" x2="100" y2="64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="78" x2="100" y2="78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Encapsulamento central do chip -->
  <rect x="36" y="36" width="56" height="56" rx="10" fill="#ffffff"/>
  <rect x="42" y="42" width="44" height="44" rx="7" fill="#27ae60"/>

  <!-- Símbolo "i" de informação minimalista no núcleo -->
  <circle cx="64" cy="52" r="3.5" fill="#ffffff"/>
  <rect x="61.5" y="59" width="5" height="17" rx="2.5" fill="#ffffff"/>
</svg>
