```conf
# =============================================================
# KITTY — CONFIGURAÇÃO PRINCIPAL
# EndeavourOS | KDE Plasma | Zsh
# =============================================================


# -------------------------------------------------------------
# 1. TIPOGRAFIA E CURSOR
# -------------------------------------------------------------

font_family JetBrains Mono
font_size 10.0

cursor_shape beam
cursor_blink_interval 0.5


# -------------------------------------------------------------
# 2. TRANSPARÊNCIA E SELEÇÃO
# -------------------------------------------------------------

background_opacity 0.95

# -------------------------------------------------------------
# 3. TEMA DE CORES
# -------------------------------------------------------------
include current-theme.conf

# -------------------------------------------------------------
# 4. ABAS
# -------------------------------------------------------------

tab_title_template "/ {title} /"

tab_bar_edge top
tab_bar_align left
tab_bar_style powerline
tab_bar_min_tabs 1

active_tab_foreground #ffffff
active_tab_background #766894
active_tab_font_style bold

inactive_tab_foreground #ffffff
inactive_tab_background #534a75
inactive_tab_font_style normal

tab_bar_background #322c46
tab_bar_margin_height 0 2

# -------------------------------------------------------------
# 5. ATALHOS — ABAS
# -------------------------------------------------------------

# Criar e fechar abas
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

# Navegar entre abas
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

map alt+right next_tab
map alt+left previous_tab

# Ir diretamente para uma aba
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3

# Mover abas
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward


# -------------------------------------------------------------
# 6. ATALHOS — PAINÉIS
# -------------------------------------------------------------

# Dividir verticalmente
map ctrl+shift+enter launch --location=vsplit

# Dividir horizontalmente
map ctrl+shift+n launch --location=hsplit


# -------------------------------------------------------------
# 7. ZSH EDIT-SELECT
# -------------------------------------------------------------

# Enviar sequência de cópia para o shell/plugin
map ctrl+c send_text all \x1b[67;6u

# Ctrl+Shift+C envia interrupção (SIGINT)
map ctrl+shift+c send_text all \x03

# Redo com Ctrl+Shift+Z
map ctrl+shift+z send_text all \x1b[90;6u

# Reservar atalhos de seleção para o shell/plugin
map shift+left no_op
map shift+right no_op
map shift+up no_op
map shift+down no_op
map shift+home no_op
map shift+end no_op

map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+home no_op
map ctrl+shift+end no_op


# -------------------------------------------------------------
# 8. ÁUDIO
# -------------------------------------------------------------

enable_audio_bell no
```
